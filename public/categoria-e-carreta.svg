<svg width="100" height="60" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cabine do caminhão -->
  <rect x="5" y="25" width="20" height="20" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  
  <!-- Para-brisa -->
  <rect x="7" y="27" width="16" height="8" rx="1" fill="#93c5fd" stroke="#3b82f6" stroke-width="0.5"/>
  
  <!-- Carroceria/Container -->
  <rect x="25" y="20" width="65" height="25" rx="2" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  
  <!-- Detalhes da carroceria -->
  <line x1="30" y1="20" x2="30" y2="45" stroke="#991b1b" stroke-width="1"/>
  <line x1="40" y1="20" x2="40" y2="45" stroke="#991b1b" stroke-width="1"/>
  <line x1="50" y1="20" x2="50" y2="45" stroke="#991b1b" stroke-width="1"/>
  <line x1="60" y1="20" x2="60" y2="45" stroke="#991b1b" stroke-width="1"/>
  <line x1="70" y1="20" x2="70" y2="45" stroke="#991b1b" stroke-width="1"/>
  <line x1="80" y1="20" x2="80" y2="45" stroke="#991b1b" stroke-width="1"/>
  
  <!-- Rodas dianteiras -->
  <circle cx="15" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="15" cy="50" r="3" fill="#6b7280"/>
  
  <!-- Rodas traseiras (eixo duplo) -->
  <circle cx="35" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="35" cy="50" r="3" fill="#6b7280"/>
  <circle cx="45" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="45" cy="50" r="3" fill="#6b7280"/>
  
  <!-- Rodas da carreta (eixo triplo) -->
  <circle cx="70" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="70" cy="50" r="3" fill="#6b7280"/>
  <circle cx="80" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="80" cy="50" r="3" fill="#6b7280"/>
  <circle cx="85" cy="50" r="5" fill="#374151" stroke="#111827" stroke-width="1"/>
  <circle cx="85" cy="50" r="3" fill="#6b7280"/>
  
  <!-- Faróis -->
  <circle cx="25" cy="32" r="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
  <circle cx="25" cy="38" r="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
  
  <!-- Texto categoria E -->
  <text x="50" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1f2937">CATEGORIA E</text>
</svg>